[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "layer-placement"
version = "0.1.0"
description = ""
readme = "README.md"
license = "MIT"
authors = ["Torsten Scholak <torsten.scholak@servicenow.com>"]
maintainers = ["Torsten Scholak <torsten.scholak@servicenow.com>"]
packages = [{ include = "place_layers", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12"
pydantic = ">=2.0.0"
hydra-core = ">=1.3.0"
omegaconf = ">=2.3.0"
rich = ">=13.0.0"
aiohttp = ">=3.9.0"
uvicorn = ">=0.27.0"
fastapi = ">=0.109.0"
tenacity = ">=8.2.0"
numpy = ">=1.24.0"
pandas = ">=2.0.0"
matplotlib = ">=3.7.0"
seaborn = ">=0.12.0"
scipy = ">=1.10.0"
torch = {version = ">=2.0.0", optional = true}
transformers = {version = ">=4.35.0", optional = true}
accelerate = ">=0.20.0"
lm-eval = ">=0.4.0"
datasets = {version = ">=2.14.0", optional = true}
tinybenchmarks = {git = "https://github.com/felipemaiapolo/tinyBenchmarks"}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.0.0"
pytest-mock = ">=3.10.0"

# Code formatting and linting
black = ">=23.0.0"
ruff = "^0.13.1"

# Type checking
mypy = ">=1.0.0"

# Pre-commit hooks
pre-commit = ">=3.0.0"

# Additional dev tools
flake8 = ">=6.0.0"        # Kept for compatibility, but ruff is preferred
hypothesis = "^6.140.2"
scipy-stubs = "^1.16.2.0"

[tool.poetry.extras]
transformers = ["torch", "transformers"]
all = ["torch", "transformers", "datasets"]

[tool.poetry.urls]

[tool.poetry.scripts]
place-layers = "place_layers.__main__:main"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--color=yes",
    "--cov=src/place_layers",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-m",
    "not slow",                  # Skip slow tests by default
]
markers = ["slow: mark test as slow to run"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]


[tool.coverage.run]
source = ["src/place_layers"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
)/
'''


[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203", # whitespace before ':'
    "E501", # line too long (handled by black)
    "W503", # line break before binary operator
]
exclude = [".git", "__pycache__", ".pytest_cache", ".venv", "build", "dist"]


[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true


[[tool.mypy.overrides]]
module = ["aiohttp.*"]
ignore_missing_imports = true


[tool.ruff]
line-length = 88
target-version = "py312" # Use py312 for now (ruff doesn't support py313 yet)
fix = true               # Automatically fix issues when possible

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade - enforces modern Python patterns
    "FA", # flake8-future-annotations
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.pyupgrade]
# Remove imports from typing that are available in stdlib
keep-runtime-typing = false

[tool.ruff.lint.isort]
known-first-party = ["place_layers"]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]
