# ================================================================================
# KEY FINDINGS
# ================================================================================
#
# FINDING 1: SA dominates at LOW budgets (multi-seed analysis)
# ------------------------------------------------------------
# When averaging across different problems (seeds), SA dominates the Pareto
# frontier for budgets < 50k evals. SA is 75% of frontier points.
#
# FINDING 2: Hier dominates on a FIXED problem (single-seed analysis)
# -------------------------------------------------------------------
# When measuring variance on ONE problem:
#   - Hier gets 22.29 with just 3k evals, GUARANTEED every time
#   - SA needs 37k+ evals for its MEAN to exceed 22.29
#   - SA's WORST CASE never reliably beats Hier's baseline
#   - SA only wins on MEAN at 50k+ evals; NEVER wins on worst-case
#
# FINDING 3: Hier is DETERMINISTIC, SA has variance
# -------------------------------------------------
#   - Hier: same result every time (std=0.00)
#   - SA: 0.3-1.0 point variance even at high budgets
#   - SA max often equals Hier, but only ~20% of runs hit it
#
# FINDING 4: Both reach same optimum (23.38)
# ------------------------------------------
#   - Hier 54×b8: guaranteed at 155k evals
#   - SA 54×3000: only ~20% of runs hit 23.38, even at 159k evals
#
# ================================================================================
# RECOMMENDATIONS
# ================================================================================
#
# FOR RELIABILITY (worst-case guarantee):
#   → Use Hier at all budget levels
#   → Hier 5×b1: 22.29 score at 3k evals (fast, reliable)
#   → Hier 54×b8: 23.38 score at 155k evals (best possible)
#
# FOR BEST EXPECTED PERFORMANCE:
#   Budget < 3k:    SA (only option, Hier not available)
#   Budget 3k-50k:  Hier (guaranteed 22.29 beats SA mean)
#   Budget 50k+:    SA mean slightly beats Hier, but at variance risk
#
# FOR EXPLORATION (different search regions):
#   → SA explores more diverse solutions
#   → Run SA multiple times, take best result
#   → But beware: worst-case SA never reliably beats Hier
#
# DEFAULT RECOMMENDATION: Use Hier (cost_constrained_hierarchical.yaml)
#   - Deterministic, no variance
#   - Reaches 22.29 at just 3k evals
#   - Reaches optimal 23.38 at 155k evals
#   - SA only preferred if you want to gamble on beating mean
#
# References:
#   - Kirkpatrick et al. (1983) "Optimization by Simulated Annealing"
#   - Ben-Ameur (2004) "Computing the Initial Temperature of Simulated Annealing"
#     https://link.springer.com/article/10.1023/B:COAP.0000044187.23143.bd

strategy_type: cost_constrained_annealing

# Outer loop: number of allocations to explore
max_allocations: 50

# Inner loop: SA steps per allocation
# Total evaluations ≈ max_allocations × max_steps = 50 × 1000 = 50,000
# This puts us at the crossover point where SA matches/beats Hier on mean
max_steps: 1000

# Initial temperature calibrated for ~80% acceptance of worsening moves
# Derived via binary search on sampled delta distribution (see procedure above)
initial_temperature: 4.4

# Cooling rate computed from: (min_temp / init_temp)^(1/max_steps)
# = (0.001 / 4.4)^(1/1000) = 0.9916
cooling_rate: 0.9916

# Minimum temperature before early termination
# When T < min_temperature, SA becomes pure hill-climbing
min_temperature: 0.001

# Random seed for reproducibility
# Set to an integer for deterministic SA runs (useful for debugging/testing)
# Leave as null for non-deterministic behavior (default, uses system entropy)
seed: null
