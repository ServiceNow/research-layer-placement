# @package search_strategy
#
# Simulated Annealing for Cost-Constrained Search
# ================================================
#
# This strategy uses simulated annealing as the inner loop for exploring
# assignment space within each fixed allocation.
#
# AUTOMATED CALIBRATION
# ---------------------
# Use the calibrate_sa command to automatically determine optimal temperature:
#
#   python -m place_layers command=calibrate_sa cost_budget=6.4
#
# This will:
#   1. Sample the delta distribution from random allocation-preserving swaps
#   2. Find the temperature achieving 80% acceptance of worsening moves
#   3. Compute the cooling rate for your step budget
#   4. Output a YAML snippet ready to paste into this config
#
# Example output:
#   initial_temperature: 4.6885
#   cooling_rate: 0.972217
#   min_temperature: 0.001
#   max_steps: 300
#
# MANUAL CALIBRATION PROCEDURE
# ----------------------------
# If you prefer to calibrate manually, follow these steps:
#
# Step 1: Sample the delta distribution
#   - For a representative allocation, sample ~200 random allocation-preserving swaps
#   - Compute delta = new_score - current_score for each
#   - Separate into positive (improving) and negative (worsening) deltas
#
#   For our problem (24-48 layers, 3 mixers), we observed:
#     - ~50% improving, ~50% worsening moves
#     - Negative deltas: avg ≈ -1.1, range [-4.2, -0.03]
#     - Positive deltas: avg ≈ +1.6, range [+0.1, +4.0]
#
# Step 2: Find initial temperature for target acceptance ratio
#   - Literature recommends χ₀ = 0.8 (80% acceptance of worsening moves)
#   - The acceptance probability for delta d < 0 at temperature T is: exp(d/T)
#   - Find T such that: mean(exp(d/T) for d in negative_deltas) ≈ χ₀
#   - This requires binary search (not analytically solvable)
#
#   For our problem:
#     - 50% acceptance → T ≈ 1.25
#     - 70% acceptance → T ≈ 2.2
#     - 80% acceptance → T ≈ 4.4  ← RECOMMENDED
#     - 90% acceptance → T ≈ 8.9
#
# Step 3: Compute cooling rate from step budget
#   - Given max_steps and min_temperature, compute:
#       cooling_rate = (min_temperature / initial_temperature)^(1/max_steps)
#
#   For initial_temperature=4.4, min_temperature=0.001:
#     - 100 steps → cooling_rate = 0.920
#     - 200 steps → cooling_rate = 0.959
#     - 300 steps → cooling_rate = 0.972
#     - 500 steps → cooling_rate = 0.983
#
