# @package search_strategy
#
# Swap Beam Search for Cost-Constrained Problems
# ===============================================
#
# NOT RECOMMENDED: This strategy is computationally expensive and rarely
# competitive with Hierarchical or SA on the Pareto frontier.
#
# Results on 48-layer problem:
#   swap_20x8x10:   evals=554,852    score=27.98
#   swap_30x10x15:  evals=1,198,276  score=28.55
#
# Compare to:
#   Hier 54×b8:     evals=155,614    score=23.38 (7x fewer evals)
#   SA 30×500:      evals=15,030     score=27.99 (37x fewer evals)
#
# This strategy explores the search space by systematically trying all
# possible layer swaps from each candidate. While thorough, the quadratic
# cost (beam × layers × layers) makes it impractical for most use cases.
#
# Use Hierarchical (cost_constrained_hierarchical.yaml) instead.

strategy_type: cost_constrained_swap_beam
max_allocations: 50
beam_width: 12
max_iterations_per_allocation: 20
