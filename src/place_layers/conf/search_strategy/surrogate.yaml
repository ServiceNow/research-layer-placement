# @package search_strategy
#
# Surrogate-assisted SA search: Ridge + Bootstrap ensemble + Expected Improvement.
#
# Uses a Ridge regression surrogate to score candidate placements cheaply,
# then validates top candidates with the real evaluator.
#
# Requires a pre-built exploration dataset from explore_placements command.
# Refinement: surrogate drafts candidates, acquisition selects top-k, evaluator validates.

defaults:
  - /sa: surrogate

strategy_type: surrogate

# Path to JSON dataset from explore_placements command (required)
exploration_dataset_path: ???

cv_folds: 5

# --- Refinement loop ---
num_rounds: 4
evals_per_round: 500

# --- Surrogate model ---
surrogate:
  surrogate_type: ridge
  n_bootstraps: 50
  ei_xi: 0.01

# Risk buckets: null for ridge, required list for bayesian_ridge
risk_buckets: null
