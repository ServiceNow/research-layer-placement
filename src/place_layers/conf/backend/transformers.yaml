# @package backend
# HuggingFace Transformers backend configuration
#
# Loads model locally using transformers library.
# Supports dynamic mixer placement for Apriel2 supernet models.

backend_type: transformers

model_path: ${model.model_path}  # From model config group
tokenizer_path: null  # Defaults to model_path if null
torch_dtype: ${model.torch_dtype}
device_map: cuda
trust_remote_code: ${model.trust_remote_code}
revision: null  # HuggingFace revision (branch, tag, or commit hash)
attn_implementation: null  # Use model's default attention implementation
batch_size: 4
flush_timeout: 0.1  # Flush partial batches after 100ms (required for REST server)
