# @package backend
# REST backend configuration for distributed TransformersBackend
#
# Distributes requests across multiple REST servers using round-robin.
# Each server should be started with the serve command:
#   CUDA_VISIBLE_DEVICES=0 python -m place_layers +experiments=serve_apriel2_0_5b_dev port=8080
#   CUDA_VISIBLE_DEVICES=1 python -m place_layers +experiments=serve_apriel2_0_5b_dev port=8081
#
# Usage (no model config needed - structure discovered from servers):
#   python -m place_layers +command=evaluate +backend=rest \
#       backend.servers='["http://localhost:8080","http://localhost:8081"]' \
#       +evaluator=generative +task=gsm8k +generation=greedy

backend_type: rest

# List of server URLs to distribute requests across
# Override via command line or environment variables
servers:
  - ${oc.env:REST_SERVER_0,http://localhost:8080}

# Maximum concurrent requests per server
# Total concurrent = max_concurrent_per_server * len(servers)
max_concurrent_per_server: 8

# Request timeout in seconds
timeout_seconds: 300

# Server health recovery settings
base_recovery_interval: 10.0  # Initial wait before retrying unhealthy server (seconds)
max_recovery_interval: 30.0   # Cap on exponential backoff (seconds)
max_retries: 10               # Max retry attempts when all servers fail
