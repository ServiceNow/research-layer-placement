# @package evaluators
# Multi-evaluator config for Apriel2 optimization
# Combines MMLU (likelihood), FDA (generative extraction), SWDE (generative extraction),
# and importance-weighted evaluation from precomputed traces
#
# Note: This config expects _mmlu_task, _fda_task, _swde_task to be loaded
# at the global level by the experiment config.

evaluators_dict:
  mmlu:
    evaluator_type: likelihood
    backend: ${backend}
    tasks: ${_mmlu_task.tasks}
    num_fewshot: ${_mmlu_task.num_fewshot}
    max_problems_per_task: ${_mmlu_task.max_problems_per_task}
    split: ${_mmlu_task.split}
    use_chat_template: true

  fda:
    evaluator_type: generative
    backend: ${backend}
    tasks: ${_fda_task.tasks}
    num_fewshot: ${_fda_task.num_fewshot}
    max_problems_per_task: ${_fda_task.max_problems_per_task}
    split: ${_fda_task.split}
    # Generation parameters
    samples_per_problem: ${generation.samples_per_problem}
    max_new_tokens: ${generation.max_new_tokens}
    temperature: ${generation.temperature}
    top_p: ${generation.top_p}
    use_chat_template: false
    evaluate_truncated_samples: true  # Extraction tasks should evaluate truncated samples

  swde:
    evaluator_type: generative
    backend: ${backend}
    tasks: ${_swde_task.tasks}
    num_fewshot: ${_swde_task.num_fewshot}
    max_problems_per_task: ${_swde_task.max_problems_per_task}
    split: ${_swde_task.split}
    # Generation parameters
    samples_per_problem: ${generation.samples_per_problem}
    max_new_tokens: ${generation.max_new_tokens}
    temperature: ${generation.temperature}
    top_p: ${generation.top_p}
    use_chat_template: false
    evaluate_truncated_samples: true  # Extraction tasks should evaluate truncated samples

  importance_weighted:
    evaluator_type: importance_weighted
    backend: ${backend}
    # Trace sources - list of directories containing JSONL trace files
    # Can be overridden via command line or environment variable
    trace_sources:
      - ${oc.env:TRACE_PATH,/workspace/outputs/traces}
    # Optional per-task weights (null = equal weighting)
    task_weights: null
    # Importance sampling clipping for numerical stability
    weight_clip_min: 1e-300
    weight_clip_max: 1e300

weights:
  mmlu: 0.25
  fda: 0.25
  swde: 0.25
  importance_weighted: 0.25

aggregation: weighted_average
