# @package evaluators
# Multi-evaluator with first_only aggregation
# Use case: Optimize for first evaluator, but track additional metrics
# Useful for logging multiple metrics without affecting optimization

evaluators_dict:
  gsm8k:
    evaluator_type: generative
    backend: ${backend}
    tasks: ["gsm8k"]
    generation: ${generation}

  mmlu:
    evaluator_type: likelihood
    backend: ${backend}
    tasks: ["mmlu"]

  arc_easy:
    evaluator_type: likelihood
    backend: ${backend}
    tasks: ["arc_easy"]

# Use first evaluator (gsm8k) for optimization
# Others are just for tracking/logging
aggregation: first_only
