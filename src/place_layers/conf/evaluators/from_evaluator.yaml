# @package evaluators
# Wrapper to use single evaluator config with evaluators field
# This provides backwards compatibility for experiments that use /evaluator: in defaults
#
# Usage in experiment config:
#   defaults:
#     - /command: evaluate
#     - /evaluator@evaluators.configs.main: generative
#     - /backend: transformers
#     ...

configs:
  # Will be populated by /evaluator@evaluators.configs.main override
  main: ???

# Single evaluator = weight 1.0, no aggregation needed
aggregation: first_only
