# @package problem
# Cost-constrained problem: Minimize cost subject to performance >= target
# Uses the "small" evaluator with 20 layers and 3 mixers

problem_type: cost_min_cost

# Cost model: linear in mixer assignments
# Mixer costs represent relative time per layer (e.g., from profiling)
# mixer_0 = full attention (slowest, most powerful)
# mixer_1 = sliding window (medium)
# mixer_2 = SSM/linear (fastest, least powerful)
#
# Mixer names must match MockSupernetEvaluator's generated names (mixer_0, mixer_1, etc.)
# Key order determines hierarchical search phase order:
#   mixer_0 assigned first, then mixer_1, then mixer_2 gets remainder.
cost_model:
  cost_model_type: linear
  mixer_costs:
    mixer_0: 1.0  # Phase 0 (full attention)
    mixer_1: 0.5  # Phase 1 (sliding window)
    mixer_2: 0.2  # Remainder (SSM/linear)

# Performance target: find cheapest config that achieves at least this score
# Note: Actual target depends on the evaluator's score range
# For MockSupernetEvaluator with default settings, scores typically range from -5 to +15
performance_target: 5.0
