# @package problem
# Cost-constrained problem: Maximize performance subject to cost <= budget
# Uses the "small" evaluator with 20 layers and 3 mixers

problem_type: cost_max_performance

# Cost model: linear in mixer assignments
# Mixer costs represent relative time per layer (e.g., from profiling)
# mixer[0] = full attention (slowest, most powerful)
# mixer[1] = sliding window (medium)
# mixer[2] = SSM/linear (fastest, least powerful)
cost_model:
  cost_model_type: linear
  mixer_costs: [1.0, 0.5, 0.2]

# Budget: allow up to this total cost
# With 20 layers:
#   - Min cost (all SSM): 20 * 0.2 = 4.0
#   - Max cost (all attention): 20 * 1.0 = 20.0
# Budget of 8.0 allows ~6-8 attention-equivalent layers
cost_budget: 8.0
