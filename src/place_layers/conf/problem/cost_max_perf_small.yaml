# @package problem
# Cost-constrained problem: Maximize performance subject to cost <= budget
# Uses the "small" evaluator with 20 layers and 3 mixers

problem_type: cost_max_performance

# Cost model injected from root-level cost_model config group
cost_model: ${cost_model}

# Budget: allow up to this total cost
# With 20 layers:
#   - Min cost (all SSM): 20 * 0.2 = 4.0
#   - Max cost (all attention): 20 * 1.0 = 20.0
# Budget of 8.0 allows ~6-8 attention-equivalent layers
cost_budget: 8.0
