# @package problem
# Cost-constrained problem for 20-layer mock evaluator
problem_type: cost_max_performance

cost_model:
  cost_model_type: linear
  mixer_costs:
    m0: 1.0
    m1: 0.5
    m2: 0.2

# Budget: allows a reasonable range of allocations
# Min cost (all m2): 20 * 0.2 = 4.0
# Max cost (all m0): 20 * 1.0 = 20.0
cost_budget: 8.0
