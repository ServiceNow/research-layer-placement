# @package problem
# Cost-constrained problem for Apriel 0.5B (24 layers)
# Maximize performance subject to latency budget

problem_type: cost_max_performance

# Cost model: linear in mixer assignments.
# Costs derived from throughput measurements (cost = 1/speedup).
# Key order determines hierarchical search phase order.
cost_model:
  cost_model_type: linear
  mixer_costs:
    attention: 1.0         # 1.0x speedup (baseline)
    sliding_window: 0.156  # 6.4x speedup
    kda: 0.11              # ~9x speedup
    gdn: 0.09              # 11.1x speedup (remainder)

# Budget in normalized cost units (attention layer = 1.0)
# Formula: budget = num_layers / target_speedup
# Example: 6x speedup -> 24 / 6 = 4.0
cost_budget: 4.0
