# @package problem
# Cost-constrained problem for 10-layer mock evaluator
problem_type: cost_max_performance

# Cost model injected from root-level cost_model config group
cost_model: ${cost_model}

# Budget: allows a reasonable range of allocations
# Min cost (all m2): 10 * 0.2 = 2.0
# Max cost (all m0): 10 * 1.0 = 10.0
cost_budget: 4.0
