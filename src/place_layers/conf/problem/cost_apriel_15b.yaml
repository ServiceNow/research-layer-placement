# @package problem
# Cost-constrained problem for Apriel 15B (48 layers)
# Maximize performance subject to latency budget

problem_type: cost_max_performance

# Cost model derived from empirical speedup measurements:
#   All FA (48 layers):  baseline (1.0× speedup)
#   All SWA (48 layers): 6.4× speedup → cost = 1/6.4 = 0.156
#   All GDN (48 layers): 11.1× speedup → cost = 1/11.1 = 0.09
#   All KDA (48 layers): ~9× speedup → cost ≈ 0.11
#
# KDA estimate: switching from GDN to KDA at 3 FA + 3 SWA requires
# dropping 1 FA layer to stay within budget, implying c_KDA ≈ 0.11.
#
# Note: Mixed configurations show ~10% deviation from linear model.
# This is expected given R² = 0.98 for underlying regression.
#
# Ordering: [FA, SWA, GDN, KDA]
cost_model:
  cost_model_type: linear
  mixer_costs: [1.0, 0.156, 0.09, 0.11]

# Budget: normalized cost units (FA layer = 1.0)
# Examples:
#   All FA (48):   cost = 48.0  → 1.0× speedup
#   All SWA (48):  cost = 7.5   → 6.4× speedup
#   All GDN (48):  cost = 4.32  → 11.1× speedup
#   7.5× speedup:  cost = 6.4   (48/7.5)
#
# Default: 7.5× speedup target
cost_budget: 6.4
