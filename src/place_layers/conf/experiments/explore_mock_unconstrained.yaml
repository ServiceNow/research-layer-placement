# @package _global_
# Consolidated mock exploration: all MRF variants, unconstrained
defaults:
  - /command: explore_placements
  - /problem: apriel_h_1_5_15b
  - /cost_model: uniform_apriel_15b
  - /evaluators: mock_mrf_variants
  - _self_

hydra:
  job_logging:
    handlers:
      console_rich:
        level: INFO

max_samples: 10000

surrogate:
  surrogate_type: bayesian_ridge
  prior_alpha: 1.0
  prior_a0: 1.0e-6
  prior_b0: 1.0e-6
  lcb_kappa: 2.0
  feature_scaling: counts_only
