# @package _global_
#
# Experiment: placement landscape density plot.
# Requires a pre-built exploration dataset (provide landscape.exploration_dataset_path on CLI).
#
# Usage:
#   python -m place_layers +experiments=placement_landscape \
#       landscape.exploration_dataset_path=exploration_results.json

defaults:
  - /command: placement_landscape
  - /cost_model: linear_apriel_15b
  - /landscape: apriel_15b
  - _self_

hydra:
  job_logging:
    handlers:
      console_rich:
        level: INFO
