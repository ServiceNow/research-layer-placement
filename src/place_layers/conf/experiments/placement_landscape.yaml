# @package _global_
#
# Experiment: placement landscape density plot.
# Requires exploration_results_{obj_name}.json from explore_placements.
#
# Usage:
#   python -m place_layers +experiments=placement_landscape \
#       +evaluator@evaluators.configs.mock=mock_apriel_h_1_5_15b \
#       landscape.explore_output_dir=/path/to/explore/output

defaults:
  - /command: placement_landscape
  - /cost_model: linear_apriel_15b
  - /landscape: apriel_15b
  - _self_

hydra:
  job_logging:
    handlers:
      console_rich:
        level: INFO
