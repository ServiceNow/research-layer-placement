# @package _global_
# Pipeline step 2 (Bayesian): validate landscape with Bayesian Viterbi + Apriel2 real evaluators.
#
# Uses apriel2_long_mix evaluators (MMLU, FDA, SWDE, AIME24, AIME25, MATH500, NIAH, RULER)
# via REST DNS backend.
#
# Usage:
#   python -m place_layers +experiments=validate_bayesian_apriel2_unconstrained \
#       +backend=rest_dns backend.num_servers=48 \
#       'landscape.explore_output_dir="/path/to/explore/output"'
defaults:
  - /command: validate_landscape
  - /cost_model: linear_apriel_15b
  - /landscape: apriel_15b
  - /evaluators: apriel2_long_mix
  - /search_strategy: bayesian_viterbi_surrogate
  - _self_

landscape:
  surrogate:
    surrogate_type: bayesian_ridge
    prior_alpha: 1.0
    prior_a0: 1.0e-6
    prior_b0: 1.0e-6
    feature_scaling: counts_only
    alpha_selection: evidence

search_strategy:
  exploration_dataset_path: null
  num_rounds: 1
  evals_per_round: 20
  candidates_per_model: 200
  surrogate:
    alpha_selection: evidence

hydra:
  job_logging:
    handlers:
      console_rich:
        level: INFO
