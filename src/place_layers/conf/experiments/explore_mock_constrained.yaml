# @package _global_
# Consolidated mock exploration: all MRF variants, cost-constrained
#
# Produces per-objective datasets:
#   exploration_results_range1.json
#   exploration_results_triplet.json
#   exploration_results_range2_triplet.json
#   exploration_results_range3.json
defaults:
  - /command: explore_placements
  - /problem: cost_max_perf_apriel_15b
  - /cost_model: linear_apriel_15b
  - /evaluators: mock_mrf_variants
  - _self_

hydra:
  job_logging:
    handlers:
      console_rich:
        level: INFO

max_samples: 10000
