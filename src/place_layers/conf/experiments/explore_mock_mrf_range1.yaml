# @package _global_
# Surrogate exploration: baseline MRF (unary + range-1 pairwise only)
#
# Usage:
#   python -m place_layers +experiments=explore_mock_mrf_range1
defaults:
  - /command: explore_placements
  - /evaluator@evaluators.configs.main: mock_mrf_range1
  - /problem: cost_max_perf_apriel_15b
  - /cost_model: linear_apriel_15b
  - _self_

hydra:
  job_logging:
    handlers:
      console_rich:
        level: INFO

max_samples: 10000
