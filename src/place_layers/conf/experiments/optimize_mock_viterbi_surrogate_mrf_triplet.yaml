# @package _global_
#
# Experiment: bootstrap Viterbi surrogate search on mock MRF triplet evaluator.
# Paired with explore_mock_mrf_triplet for dataset generation.
# Requires a pre-built exploration dataset (provide exploration_dataset_path on CLI).

defaults:
  - /command: optimize
  - /evaluator@evaluators.configs.triplet: mock_mrf_triplet
  - /problem: cost_max_perf_apriel_15b
  - /cost_model: linear_apriel_15b
  - /search_strategy: viterbi_surrogate
  - /result_handler: json
  - _self_

search_strategy:
  exploration_dataset_path: ???
  num_rounds: 2
  evals_per_round: 200
