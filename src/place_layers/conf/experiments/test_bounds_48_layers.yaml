# @package _global_
# Test scenario: realistic 48-layer model (like Apriel)
# Usage: python -m place_layers +experiments=test_bounds_48_layers

defaults:
  - /command: optimize
  - /evaluator: mock_apriel_h_1_5_15b
  - /problem: cost_max_perf_apriel_15b
  - /search_strategy: cost_constrained_hierarchical
  - /result_handler: json
  - _self_

search_strategy:
  max_allocations: 10
  beam_width: 3
  early_stop_threshold: 0.0  # Disable for predictable upper bound
  cross_phase_beam_width: 1
