# @package _global_
# Pipeline step 3 (Bayesian): placement landscape with Bayesian Ridge surrogate.
# Matches the surrogate used in validate_bayesian_mock_unconstrained.
#
# Usage:
#   python -m place_layers +experiments=landscape_bayesian_mock_unconstrained \
#       landscape.explore_output_dir=/path/to/explore/output
#
# With validation overlay:
#   python -m place_layers +experiments=landscape_bayesian_mock_unconstrained \
#       landscape.explore_output_dir=/path/to/explore/output \
#       validation_output_dir=/path/to/validate/output
defaults:
  - /command: placement_landscape
  - /cost_model: linear_apriel_15b
  - /landscape: apriel_15b
  - /evaluators: mock_mrf_variants
  - _self_

landscape:
  surrogate:
    surrogate_type: bayesian_ridge
    prior_alpha: 1.0
    prior_a0: 1.0e-6
    prior_b0: 1.0e-6
    feature_scaling: counts_only

hydra:
  job_logging:
    handlers:
      console_rich:
        level: INFO
