# @package _global_
# Max-performance optimization using mock evaluator for testing/development
# Problem: Maximize performance subject to cost <= cost_budget
# Simulates Apriel-H 1.5 15B with 48 layers and 4 mixer types
#
# Usage:
#   python -m place_layers +experiments=optimize_mock_max_perf

defaults:
  - /command: optimize
  - /evaluator@evaluators.configs.main: mock_apriel_h_1_5_15b
  - /problem: cost_max_perf_apriel_15b
  - /cost_model: linear_apriel_15b
  - /search_strategy: cost_constrained_hierarchical
  - /result_handler: json
  - _self_

# Settings for demo/testing
search_strategy:
  max_allocations: 10
  beam_width: 3
