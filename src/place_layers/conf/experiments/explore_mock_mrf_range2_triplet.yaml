# @package _global_
# Surrogate exploration: skip-pairwise (range 2) + triplet interactions
#
# Usage:
#   python -m place_layers +experiments=explore_mock_mrf_range2_triplet
defaults:
  - /command: explore_placements
  - /evaluator: mock_mrf_range2_triplet
  - /problem: cost_max_perf_apriel_15b
  - /cost_model: linear_apriel_15b
  - _self_

hydra:
  job_logging:
    handlers:
      console_rich:
        level: INFO

max_samples: 10000
