# @package _global_
# Surrogate exploration using mock evaluator (48 layers, 4 mixers)
#
# Usage:
#   python -m place_layers +experiments=explore_mock_max_perf
defaults:
  - /command: explore_placements
  - /evaluator@evaluators.configs.main: mock_apriel_h_1_5_15b
  - /problem: cost_max_perf_apriel_15b
  - /cost_model: linear_apriel_15b
  - _self_

hydra:
  job_logging:
    handlers:
      console_rich:
        level: INFO

max_samples: 10000  # Smaller for mock (evaluations are cheap)
