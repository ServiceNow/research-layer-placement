# @package _global_
# Pipeline step 2: validate landscape for mock MRF variants (matches explore_mock_unconstrained).
#
# Usage:
#   python -m place_layers +experiments=validate_mock_unconstrained \
#       landscape.explore_output_dir=/path/to/explore/output
defaults:
  - /command: validate_landscape
  - /cost_model: linear_apriel_15b
  - /landscape: apriel_15b
  - /evaluators: mock_mrf_variants
  - /search_strategy: viterbi_surrogate
  - _self_

search_strategy:
  exploration_dataset_path: __DERIVED__
  num_rounds: 1
  evals_per_round: 20
  candidates_per_model: 200

hydra:
  job_logging:
    handlers:
      console_rich:
        level: INFO

# Zero noise for validation (deterministic scores)
evaluators:
  configs:
    range1:
      noise_sigma: 0.0
    triplet:
      noise_sigma: 0.0
    range2_triplet:
      noise_sigma: 0.0
    range3:
      noise_sigma: 0.0
