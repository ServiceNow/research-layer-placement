# @package hydra
# Base Hydra configuration

defaults:
  - override job_logging: rich_files
  - override hydra_logging: rich

run:
  dir: ${oc.env:OUTPUT_BASE,outputs}/${path_truncate:${path_sanitize_fragment:${hydra.job.override_dirname}},120}__${path_hash:${hydra.job.override_dirname},12}

sweep:
  dir: ${oc.env:OUTPUT_BASE,outputs}/multirun/${path_truncate:${path_sanitize_fragment:${hydra.job.override_dirname}},120}__${path_hash:${hydra.job.override_dirname},12}
  subdir: ${hydra.job.num}

job:
  chdir: true
  config:
    override_dirname:
      exclude_keys:
        - hydra.run.dir
        - hydra.sweep.dir
        - hydra.output_subdir
        - hydra.job.chdir
        - output_path
