# @package hydra
# Base Hydra configuration

defaults:
  - override job_logging: rich_files
  - override hydra_logging: rich

run:
  dir: outputs/${hydra.job.override_dirname}

sweep:
  dir: multirun/${hydra.job.override_dirname}
  subdir: ${hydra.job.num}

job:
  chdir: true
  config:
    override_dirname:
      exclude_keys:
        - hydra.run.dir
        - hydra.sweep.dir
        - hydra.output_subdir
        - hydra.job.chdir
        - output_path
