# @package _global_
#
# Surrogate Exploration Command
# =============================
# Builds a dataset of evaluated placements for surrogate model training.
# Uses adaptive sampling: evaluates batches until surrogate quality plateaus.
#
# Usage:
#   python -m place_layers +command=explore_placements +evaluator@evaluators.configs.mock=mock_apriel_h_1_5_15b +problem=cost_max_perf_apriel_15b

defaults:
  - /result_handler: json
  - /objective@evaluators.objective: weighted_average
  - _self_

command: explore_placements
cost_model: ${cost_model}
problem: null

# Adaptive sampling
min_samples: 1000       # Initial batch before first quality check
batch_size: 500         # Samples per subsequent batch
max_samples: 10000      # Hard cap on total evaluations

# Stopping criteria
plateau_patience: 3            # Batches without improvement before stopping
plateau_min_improvement: 0.02  # Minimum quality improvement to count as progress

seed: 42

# Surrogate model — determines expansion selection method and quality metric.
# Ridge: cv_folds + target_rank_correlation control stopping.
# Bayesian Ridge: plateau on batch predictive score (no target).
surrogate:
  surrogate_type: ridge
  n_bootstraps: 50
  ei_xi: 0.01
  cv_folds: 5
  target_rank_correlation: 0.95

# Feature expansion selection
expansion_max_order: 3          # max n-body order to test (1=skip expansion selection)
expansion_max_range: 10         # ceiling for pairwise range search (auto-stops early)

supplemental_data_dirs: []

