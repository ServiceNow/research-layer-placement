# @package _global_
#
# Surrogate Exploration Command
# =============================
# Builds a dataset of evaluated placements for surrogate model training.
# Uses adaptive sampling: evaluates batches until surrogate quality plateaus.
#
# Usage:
#   python -m place_layers +command=explore_placements +evaluator=mock_apriel_h_1_5_15b +problem=cost_max_perf_apriel_15b

defaults:
  - /result_handler: json
  - _self_

command: explore_placements
cost_model: ${cost_model}

# Adaptive sampling
min_samples: 1000       # Initial batch before first quality check
batch_size: 500         # Samples per subsequent batch
max_samples: 10000      # Hard cap on total evaluations

# Stopping criteria
target_rank_correlation: 0.95  # Stop when Ridge CV Spearman rho reaches this (also used for expansion selection)
plateau_patience: 3            # Batches without improvement before stopping
plateau_min_improvement: 0.02  # Minimum rho improvement to count as progress
cv_folds: 5                    # Cross-validation folds for quality estimation

seed: 42

# Feature expansion selection
expansion_max_order: 3          # max n-body order to test (1=skip expansion selection)
expansion_max_range: 10         # ceiling for pairwise range search (auto-stops early)
