# @package _global_
#
# SA Temperature Calibration Command
# ==================================
#
# Determines optimal initial temperature for simulated annealing by sampling
# the delta distribution and finding the temperature that achieves a target
# acceptance ratio for worsening moves.
#
# Usage:
#   python -m place_layers command=calibrate_sa +problem=cost_max_perf_small problem.cost_budget=6.4
#
# The command will output:
#   - Delta distribution statistics
#   - Calibrated initial_temperature
#   - Computed cooling_rate
#   - YAML snippet ready to paste into a search strategy config

defaults:
  - /result_handler: yaml
  - /objective@evaluators.objective: weighted_average

command: calibrate_sa

# Calibration parameters
target_acceptance: 0.8  # 80% acceptance of worsening moves (standard literature value)
num_samples: 200        # Number of ruin-and-recreate moves to sample
max_steps: 300          # SA steps per allocation (for computing cooling rate)
min_temperature: 0.001  # Minimum temperature before pure hill-climbing
seed: 42                # Random seed for reproducibility

# Move operator parameters (must match your SA search config)
initial_temperature_guess: 4.4  # Guess for k-distribution; re-run if result is far off
max_ruin_fraction: 0.25         # Max fraction of layers ruined at full temperature
contiguous_ruin_probability: 0.3  # Probability of contiguous vs scattered ruin

