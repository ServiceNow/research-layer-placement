# @package _global_
#
# Optimize Speculative Command
# ============================
# Find the draft placement minimising speculative decoding cost:
#   spec_cost = (gamma * c_d + c_t) / (gamma * a_d + 1)
#
# Requires exploration_results_{obj_name}.json from explore_placements
# (run with an acceptance-rate evaluator).
#
# Usage:
#   python -m place_layers +command=optimize_speculative \
#       +cost_model=linear_apriel_15b +landscape=apriel_15b \
#       landscape.explore_output_dir=/path/to/explore/output

defaults:
  - /objective@evaluators.objective: weighted_average

command: optimize_speculative
landscape: ${landscape}
gamma: 8
target_placement:
  - attention
cost_budget: 4.0
num_validate: 0

# Pareto plot y-axis: "speculative_cost" or "speedup" (c_t / spec_cost)
pareto_y_axis: speedup
# Rolling window for "best per cost" smooth curve (odd = symmetric)
pareto_smooth_window: 5
