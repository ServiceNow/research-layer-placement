# @package _global_
# Precompute traces command - generate completions for importance weighting
#
# Required config groups (must be specified by user or experiment):
#   - backend: vllm, transformers
#   - task: gsm8k, etc.
#   - generation: sampling (typically)
#
# Usage:
#   python -m place_layers command=precompute_traces \
#       backend=vllm task=gsm8k generation=sampling

command: precompute_traces

# Backend configuration (from backend config group)
backend: ${backend}

# Task configuration (from task config group)
tasks: ${task.tasks}
num_fewshot: ${task.num_fewshot}
max_problems_per_task: ${task.max_problems_per_task}
split: ${task.split}

# Generation parameters (from generation config group)
samples_per_problem: ${generation.samples_per_problem}
max_new_tokens: ${generation.max_new_tokens}
temperature: ${generation.temperature}
top_p: ${generation.top_p}

# Trace-specific configuration
seed: 42

# Answer extraction pattern (optional)
# Regex with capture group to extract answer region from completion.
# Example for Apriel: '\[BEGIN FINAL RESPONSE\](.*?)(?:<\|end\|>|$)'
# Uses model config if available, otherwise null
answer_extraction_pattern: ${oc.select:model.answer_extraction_pattern,null}
