# @package _global_
# Evaluate command - run evaluation on a single placement
#
# Required config groups:
#   - evaluator: generative, importance_weighted, etc.
#   - backend: transformers, vllm (for generative)
#   - model: apriel2_0_5b_dev, qwen2_0_5b, etc.
#   - task: gsm8k, etc. (for generative)
#   - generation: greedy, sampling (for generative)
#
# Optional:
#   - placement: all_attention, every_4th_gdn, etc. (null for non-supernets)
#
# Use Hydra --multirun for sweeps:
#   python -m place_layers ... placement=all_attention,every_4th_gdn --multirun

command: evaluate

# Mixer names (from model config)
mixer_names: ${model.mixer_names}

# Single placement (null for non-supernet models)
# Use placement config group or set directly
placement: null
