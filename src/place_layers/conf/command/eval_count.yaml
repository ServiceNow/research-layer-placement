# @package _global_
# Evaluation count calculator - compute bounds on hierarchical beam search evaluations
#
# This command calculates theoretical lower and upper bounds on the number of
# evaluations the hierarchical beam search will perform, based on problem parameters.
#
# Example usage (all parameters on CLI):
#   python -m place_layers +command=eval_count \
#       num_layers=24 \
#       cost_budget=8.4 \
#       max_allocations=100 \
#       beam_width=8 \
#       cross_phase_beam_width=1 \
#       'cost_model.mixer_costs={attention: 1.0, sliding_window: 0.156, gdn: 0.09}'
#
# Example usage (with problem config):
#   python -m place_layers +command=eval_count \
#       +problem=cost_max_perf_small \
#       num_layers=20 \
#       cost_budget=${problem.cost_budget} \
#       'cost_model=${problem.cost_model}' \
#       +search_strategy=cost_constrained_hierarchical \
#       max_allocations=${search_strategy.max_allocations} \
#       beam_width=${search_strategy.beam_width} \
#       cross_phase_beam_width=${search_strategy.cross_phase_beam_width}

command: eval_count

# Problem parameters (must be provided)
num_layers: ???
cost_budget: ???

# Cost model configuration
cost_model:
  cost_model_type: linear
  mixer_costs: ???

# Search parameters (must be provided)
max_allocations: ???
beam_width: ???
cross_phase_beam_width: 1
