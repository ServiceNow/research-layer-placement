# @package _global_
#
# Validate Landscape Command
# ===========================
# Per-band validation of surrogate predictions against real evaluator.
# Requires an exploration_results.json from the explore_placements command.
#
# Usage:
#   python -m place_layers +command=validate_landscape +evaluator=mock_apriel_h_1_5_15b +cost_model=linear_apriel_15b +landscape=apriel_15b landscape.exploration_dataset_path=exploration_results.json

command: validate_landscape
landscape: ${landscape}
evaluator: ${evaluator}

search_num_rounds: 1
search_evals_per_round: 20
search_candidates_per_model: 200
search_cv_folds: 5
search_ei_xi: 0.01
search_seed: 42
