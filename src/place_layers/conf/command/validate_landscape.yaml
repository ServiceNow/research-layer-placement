# @package _global_
#
# Validate Landscape Command
# ===========================
# Per-band validation of surrogate predictions against real evaluator.
# Requires exploration_results_{obj_name}.json files from explore_placements.
#
# The evaluator is composed via:
#   +evaluator@evaluators.configs.main=generative
#
# Usage:
#   python -m place_layers +command=validate_landscape \
#       +evaluator@evaluators.configs.main=mock_apriel_h_1_5_15b \
#       +cost_model=linear_apriel_15b +landscape=apriel_15b \
#       landscape.explore_output_dir=/path/to/explore/output

defaults:
  - /evaluators: from_evaluator

command: validate_landscape
landscape: ${landscape}

search_num_rounds: 1
search_evals_per_round: 20
search_candidates_per_model: 200
search_cv_folds: 5
search_ei_xi: 0.01
search_seed: 42
