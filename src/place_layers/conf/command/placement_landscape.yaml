# @package _global_
#
# Placement Landscape Command
# ============================
# Generates a cost-vs-quality density plot with DP-optimal Pareto line.
# Requires exploration_results_{obj_name}.json files from explore_placements.
#
# Usage:
#   python -m place_layers +command=placement_landscape \
#       +cost_model=linear_apriel_15b +landscape=apriel_15b \
#       landscape.explore_output_dir=/path/to/explore/output

defaults:
  - /objective@evaluators.objective: weighted_average

command: placement_landscape
landscape: ${landscape}

samples_per_allocation: 200

num_score_bins: 120
score_label: "Score"

display_names: null

validation_output_dir: null

