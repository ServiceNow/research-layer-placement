# @package evaluator
# Acceptance rate evaluator — estimates speculative decoding acceptance rates
# between a fixed target placement and a draft placement.
#
# Uses pre-computed teacher traces (from precompute_traces command) to
# compute full-vocabulary logits for both placements and derive:
#   - token_acceptance_prob: per-position alpha = sum_v min(p_target, p_draft)
#   - step_acceptance_rate: biased marginal estimate
#   - is_step_acceptance_rate: unbiased IS estimate (recommended)
#
# Target probabilities are cached after the first evaluate() call so
# subsequent placements only require one forward pass (draft).
#
# NOTE: Requires TransformersBackend (direct model access for full logits).
#
# Example usage with explore_placements:
#   python -m place_layers +command=explore_placements \
#       +evaluator@evaluators.configs.acc_rate=estimate_acceptance_rate \
#       +backend=transformers +model=apriel2_0_5b_dev \
#       +problem=cost_max_perf_apriel_15b +generation=sampling
#
# Example usage with evaluate (single placement):
#   python -m place_layers +command=evaluate \
#       +evaluator@evaluators.configs.acc_rate=estimate_acceptance_rate \
#       +backend=transformers +model=apriel2_0_5b_dev \
#       +generation=sampling +placement=every2nd-gdn

evaluator_type: estimate_acceptance_rate

trace_sources:
  - ${oc.env:TRACE_PATH,/workspace/outputs/gsm8k_traces}

target_placement:
  - attention

gamma: 8

# Sampling parameters — must match the generation config used for
# speculative decoding to get accurate acceptance rate estimates.
temperature: ${generation.temperature}
top_p: ${generation.top_p}

# Which metric evaluate() returns as the scalar score.
# Options: token_acceptance_prob, step_acceptance_rate, is_step_acceptance_rate
score_metric: is_step_acceptance_rate

# Whether to include truncated traces (those that hit the max-token limit).
# Default false skips them; set true for acceptance rate estimation where
# only token-level probabilities matter, not answer correctness.
include_truncated: false
