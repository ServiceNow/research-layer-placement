# @package evaluator
# MRF mock evaluator with longer-range pairwise interactions (range 2-3)
evaluator_type: mock_supernet
num_layers: 48
mixer_names: [attention, sliding_window, gdn, kda]
seed: 42
unary_bonus: 1.0
unary_penalty: 0.5
pairwise_scale: 0.3
noise_sigma: 0.2
noise_seed_shift: 0
eval_delay_seconds: 0.0
pairwise_decay: 0.9
pairwise_max_range: 3
triplet_scale: 0.0
