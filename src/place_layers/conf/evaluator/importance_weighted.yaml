# @package evaluator
# Importance-weighted accuracy evaluator
#
# Uses importance sampling to estimate subnet accuracy from pre-computed
# teacher traces. Much faster than generative evaluation (~10-100x).
#
# This config uses interpolation to compose with other config groups:
#   - backend: Generation backend (transformers, vllm, or rest)
#
# Example usage:
#   python -m place_layers +command=evaluate +evaluator=importance_weighted \
#       +backend=transformers +model=apriel2_0_5b_dev

evaluator_type: importance_weighted

# Backend configuration (composed from backend/ config group)
backend: ${backend}

# Trace sources - directories containing JSONL trace files
# Weights will be normalized to sum to 1
trace_sources:
  - path: /workspace/outputs/command=precompute_traces
    weight: 1.0
    name: GSM8K
  # Example with multiple datasets:
  # - path: /path/to/math_traces
  #   weight: 1.0
  #   name: MATH
  # - path: /path/to/aime_traces
  #   weight: 3.0  # AIME weighted 3x more important
  #   name: AIME
  # - path: /path/to/gpqa_traces
  #   weight: 1.0
  #   name: GPQA

# Importance sampling parameters
weight_clip_min: 0.01
weight_clip_max: 100.0
