# @package evaluator
evaluator_type: importance_weighted

# Model configuration
model_path: /tmp/qwen2/trained-supernet

# Trace sources - directories containing JSONL trace files
# Weights will be normalized to sum to 1
trace_sources:
  - path: /workspace/outputs/command=precompute_traces
    weight: 1.0
    name: GSM8K
  # Example with multiple datasets:
  # - path: /path/to/math_traces
  #   weight: 1.0
  #   name: MATH
  # - path: /path/to/aime_traces
  #   weight: 3.0  # AIME weighted 3x more important
  #   name: AIME
  # - path: /path/to/gpqa_traces
  #   weight: 1.0
  #   name: GPQA

# Model loading options
torch_dtype: bfloat16
device_map: auto

# Importance sampling parameters
weight_clip_min: 0.01
weight_clip_max: 100.0

# Batching parameters (for performance tuning)
# Note: batch_size > 2 may OOM on smaller GPUs with long sequences
trace_batch_size: 2  # Max traces per forward pass (higher = faster but more memory)
trace_length_tolerance: 64  # Max token length difference within a batch
