# @package evaluator
# Importance-weighted accuracy evaluator
#
# Uses importance sampling to estimate subnet accuracy from pre-computed
# teacher traces. Much faster than generative evaluation (~10-100x).
#
# Traces from all sources are merged by task_name. Optional task_weights
# allow weighting different tasks differently in the final score.
#
# This config uses interpolation to compose with other config groups:
#   - backend: Generation backend (transformers, vllm, or rest)
#
# Example usage:
#   python -m place_layers +command=evaluate +evaluator@evaluators.configs.gsm8k=importance_weighted \
#       +backend=transformers +model=apriel2_0_5b_dev

evaluator_type: importance_weighted

# Backend configuration (composed from backend/ config group)
backend: ${backend}

# Trace sources - list of directories containing JSONL trace files
# Traces are merged by task_name across all sources
trace_sources:
  - ${oc.env:TRACE_PATH,/workspace/outputs/gsm8k_traces}

# Optional per-task weights for the final weighted accuracy
# If null, all tasks are weighted equally
# Missing tasks default to 1.0 with a warning
# Extra keys are ignored with a warning
task_weights: null
# Example with custom weights:
# task_weights:
#   gsm8k: 1.0
#   math: 2.0    # MATH weighted 2x
#   aime: 3.0    # AIME weighted 3x

# Importance sampling clipping parameters
# These bounds are applied at aggregation time (in summarize_is), not during
# record creation. This allows re-running with different clipping without
# recomputing expensive model forward passes.
#
# Default: effectively no clipping (1e-300 to 1e300)
# For numerical stability with extreme weight ratios, you may want tighter bounds
# e.g., weight_clip_min: 1e-100, weight_clip_max: 1e100
weight_clip_min: 1e-300
weight_clip_max: 1e300
