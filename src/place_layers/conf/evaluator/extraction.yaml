# @package evaluator
# Extraction evaluator - generative evaluator configured for extraction tasks
#
# Differences from generative.yaml:
#   - use_chat_template: false (extraction tasks use raw text prompts)
#   - evaluate_truncated_samples: true (answer may be complete before hitting limit)
#
# Example usage:
#   python -m place_layers +command=evaluate +evaluator@evaluators.configs.swde=extraction \
#       +backend=rest +task=swde +generation=extraction

evaluator_type: generative

# Task configuration (composed from task/ config group)
tasks: ${task.tasks}
num_fewshot: ${task.num_fewshot}
max_problems_per_task: ${task.max_problems_per_task}
split: ${task.split}

# Generation parameters (composed from generation/ config group)
samples_per_problem: ${generation.samples_per_problem}
max_new_tokens: ${generation.max_new_tokens}
temperature: ${generation.temperature}
top_p: ${generation.top_p}
include_logprobs: ${generation.include_logprobs}

# Prompt formatting - extraction tasks use raw text prompts
use_chat_template: false
system_instruction: null

# Document prefetch (higher values hide I/O latency but use more memory)
doc_prefetch_count: 2

# Truncated sample handling - extraction tasks evaluate truncated samples
evaluate_truncated_samples: true

# Tokenizer for synthetic task generation (not used for extraction)
tokenizer: null
max_seq_lengths: null
