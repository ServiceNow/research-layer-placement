# @package evaluator
# Apriel-H 1.5 15B architecture (48 layers)
# Mixer types: FA (full attention), SWA (sliding window), GDN, KDA
evaluator_type: mock_supernet
num_layers: 48
mixer_names: [FA, SWA, GDN, KDA]
seed: 42
unary_bonus: 1.0
unary_penalty: 0.5
pairwise_scale: 0.3
noise_sigma: 0.2
eval_delay_seconds: 0.0
