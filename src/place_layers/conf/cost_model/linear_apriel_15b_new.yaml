# @package cost_model
# Linear cost model for Apriel 15B (48 layers, 4 mixers)
# Costs derived from empirical speedup measurements.
# Key order: attention -> sliding_window -> kda -> gdn (phase order)

cost_model_type: linear
mixer_costs:
  attention: 1.0  
  sliding_window: 0.4704
  kda: 0.2102
  gdn: 0.1367
