# @package cost_model
# Linear cost model for Apriel (v2 phase order: cheapest last = gdn)
# Costs derived from empirical speedup measurements.
# Key order: attention -> sliding_window -> kda -> gdn (phase order)

cost_model_type: linear
mixer_costs:
  attention: 1.0          # Phase 0
  sliding_window: 0.156   # Phase 1
  kda: 0.11              # Phase 2
  gdn: 0.09              # Remainder
