# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Ruff - Modern Python linter with import sorting (run before Black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']

  # Black formatter (run after Ruff)
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        args: ['--config', 'pyproject.toml']

  # Pytest - Run tests (for pre-push)
  # Disabled until tests are added
  # - repo: local
  #   hooks:
  #     - id: pytest-check
  #       name: pytest
  #       entry: poetry run pytest
  #       language: system
  #       pass_filenames: false
  #       always_run: true
  #       stages: [pre-push]
  #       args: ['-x', '--tb=short', '-q', '--no-cov']

# Define which hooks run at which stages
default_stages: [pre-commit]

# Skip these checks on CI
ci:
  skip: [pytest-check]
